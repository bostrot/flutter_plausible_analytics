name: Publish to pub.dev

# Publishing needs one of two credentials, and neither of them lives in this
# file:
#
#   * "Automated publishing" enabled for this repository under
#     pub.dev > plausible_analytics > Admin, which turns the OIDC token that
#     setup-dart requests below into a valid login. Tick the event the release
#     actually uses there - "push" covers a tag, "workflow_dispatch" covers a
#     retry from a branch - because pub.dev rejects an event it was not told
#     about, and leave "Require GitHub Actions environment" off, as no job
#     below declares an environment. Or
#   * a PUB_CREDENTIALS repository secret holding the contents of
#     ~/.config/dart/pub-credentials.json written by a local `dart pub login`.
#
# With neither of them configured the publish job stops at "publishing from
# github is not enabled".

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Lets a release be retried without moving the tag.
  workflow_dispatch:

jobs:
  validate:
    name: Analyze, test and dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Check the tag matches the pubspec version
        if: github.ref_type == 'tag'
        run: |
          version=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version" >&2
            exit 1
          fi
      - name: Check the version is not on pub.dev yet
        run: |
          name=$(awk '/^name:/ { print $2; exit }' pubspec.yaml)
          version=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pub.dev/api/packages/$name/versions/$version" || true)
          if [ "$status" = "200" ]; then
            echo "$name $version is already on pub.dev; bump the version first" >&2
            exit 1
          fi
      - run: dart pub get
      - run: dart analyze
      - run: flutter test
      # The Flutter tool rewrites checked-in files - analysis_options.yaml in
      # particular - and a dry run fails as long as a checked-in file differs
      # from what git holds, so put the tree back before asking pub.
      - name: Undo the rewrites the SDK made
        run: git checkout -- .
      - run: dart pub publish --dry-run

  publish:
    name: Publish
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      # Naming a permission drops every other one, so checkout needs its own.
      contents: read
      # Lets setup-dart request the OIDC token used when PUB_CREDENTIALS is unset.
      id-token: write
    env:
      PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
      # setup-dart exports PUB_TOKEN, and pub prefers that token over a stored
      # credential no matter what the credentials file says, so only provision
      # it when there is no credential to prefer.
      - uses: dart-lang/setup-dart@v1
        if: env.PUB_CREDENTIALS == ''
      # The Flutter SDK shadows the dart binary above but keeps its token.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Authenticate with the PUB_CREDENTIALS secret
        if: env.PUB_CREDENTIALS != ''
        run: |
          config="${XDG_CONFIG_HOME:-$HOME/.config}/dart"
          mkdir -p "$config"
          printf '%s' "$PUB_CREDENTIALS" > "$config/pub-credentials.json"
      - run: dart pub get
      # Keep the uploaded archive identical to what the tag holds.
      - name: Undo the rewrites the SDK made
        run: git checkout -- .
      - run: dart pub publish --force

  release:
    name: GitHub release
    needs: publish
    # A retry from a branch has no tag to hang a release off.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The compare link needs the tag that came before this one.
          fetch-depth: 0
      - name: Write the notes from the changelog
        run: |
          version=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          awk -v heading="## $version" '
            $0 == heading { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" || true)
          if [ -n "$previous" ]; then
            printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous" \
              "$GITHUB_REF_NAME" >> notes.md
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Releasing twice happens whenever a run is retried, so update the
          # release that is already there instead of failing on it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
