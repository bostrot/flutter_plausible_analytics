name: plausible_analytics
description: A Flutter plugin for Plausible Analytics. This uses the events API to send clickevents and goals to Plausible Analytics.
version: 0.4.0
homepage: https://github.com/bostrot/flutter_plausible_analytics.git
issue_tracker: https://github.com/bostrot/flutter_plausible_analytics/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  universal_io: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The following section is specific to Flutter.
flutter:
  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
